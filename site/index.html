<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub de Servicios | Raspberry Pi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glow"></div>
  
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Aiaco<strong>Hub</strong></span>
        <span class="node-badge">Raspi 8GB</span>
      </div>
      <div class="server-status" id="server-status">
        <span class="pulse-dot"></span>
        <span class="status-label">Caddy Proxy Activo</span>
      </div>
    </div>
  </header>

  <main class="main-container">
    <section class="hero">
      <h1 class="hero-title">Herramientas y Servicios</h1>
      <p class="hero-subtitle">Plataforma centralizada de aplicaciones locales ejecutadas en tu Raspberry Pi.</p>
    </section>

    <section class="cards-grid" id="apps-container">
      <!-- Tarjetas inyectadas dinamicamente desde apps.json -->
      <div class="loading-state">Cargando aplicaciones disponibles...</div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-info">
        <span>Raspberry Pi OS • Debian 12 Bookworm</span>
        <span>Reverse Proxy con Caddy v2.11</span>
      </div>
      <div class="footer-actions">
        <button id="refresh-status-btn" class="refresh-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
          Actualizar estado
        </button>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
